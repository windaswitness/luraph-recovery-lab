name: Tests
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m narsil demo --out work/ci-demo
      - run: python -m narsil demo-offline --out work/ci-offline-demo
      - run: python -m pip install .
      - run: narsil --help
        working-directory: ${{ runner.temp }}
      - run: narsil demo --out work/ci-installed-demo
        working-directory: ${{ runner.temp }}
      - run: narsil demo-offline --out work/ci-installed-offline-demo
        working-directory: ${{ runner.temp }}
