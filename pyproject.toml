[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "narsil"
version = "0.3.0"
description = "NARSIL: experimental Luraph and Lua/Luau VM recovery, offline unpacking, and bytecode inspection"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "NARSIL contributors"}]
keywords = ["luraph", "deobfuscation", "deobfuscator", "deobf", "lua", "luau", "devirtualization", "reverse-engineering"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Disassemblers",
]

[project.scripts]
narsil = "narsil.cli:main"

[project.urls]
Repository = "https://github.com/windaswitness/narsil"
Documentation = "https://github.com/windaswitness/narsil/tree/main/docs"
Issues = "https://github.com/windaswitness/narsil/issues"

[tool.setuptools.packages.find]
include = ["narsil*"]

[tool.setuptools.package-data]
narsil = ["resources/*.luau", "resources/*.json"]
